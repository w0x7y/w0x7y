<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">GitHub aquarium</title>
  <desc id="description">Code-shaped fish drift over a decorative GitHub contribution seabed. Rust, Go, bubbles, and seaweed move gently. The seabed is illustrative, not live contribution data.</desc>
  <style>
    text { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    
    .fish-a { animation: swim-a 24s linear infinite; }
    .fish-b { animation: swim-b 30s linear infinite; }
    .fish-c { animation: swim-c 35s linear infinite; }
    @keyframes swim-a { 0%,100% { transform: translateX(0); } 48% { transform: translateX(380px); } 50% { transform: translateX(380px); } 98% { transform: translateX(0); } }
    @keyframes swim-b { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-340px); } }
    @keyframes swim-c { 0%,100% { transform: translateX(0); } 50% { transform: translateX(190px); } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }
    .bubble { animation: bubble 9s linear infinite; }
    @keyframes bubble { 0% { transform: translateY(0); opacity:0; } 15%,70% { opacity:.55; } 100% { transform: translateY(-240px); opacity:0; } }
    .plant { transform-box: fill-box; transform-origin: bottom center; animation: sway 7s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .reveal { opacity: 1 !important; clip-path: none !important; }
    }
  </style>
