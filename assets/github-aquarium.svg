  <text x="500" y="27" fill="#8b949e" font-size="14" text-anchor="middle">GitHub aquarium</text>
  <text x="32" y="84" fill="#93ccff" font-size="21" >w0x7y / underwater</text><text x="32" y="111" fill="#8b949e" font-size="14" >A little life between commits.</text><path d="M30 137 Q110 127 190 137 T350 137 T510 137 T670 137 T830 137 T970 137" fill="none" stroke="#244452"/><g class="fish-a">
