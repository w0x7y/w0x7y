  <title id="title">w0x7y / logo studies</title>
  <desc id="description">Two strokes morph from code brackets into a W monogram and then a diamond, with a pause on each shape. The wordmark reads w0x7y, Idan Gilboa, Fullstack Developer.</desc>
  <style>
    text { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .mark-left { animation: mark-left 12s cubic-bezier(0.77,0,0.175,1) infinite; }
@keyframes mark-left { 0%,20%,100% { d: path("M -42 -42 L -68 -20 L -92 0 L -68 20 L -42 42"); } 33%,53% { d: path("M -92 -42 L -74 0 L -56 42 L -28 0 L 0 -42"); } 66%,86% { d: path("M 0 -70 L -35 -35 L -70 0 L -35 35 L 0 70"); } }
.mark-right { animation: mark-right 12s cubic-bezier(0.77,0,0.175,1) infinite; }
@keyframes mark-right { 0%,20%,100% { d: path("M 42 -42 L 68 -20 L 92 0 L 68 20 L 42 42"); } 33%,53% { d: path("M 0 -42 L 28 0 L 56 42 L 74 0 L 92 -42"); } 66%,86% { d: path("M 0 -70 L 35 -35 L 70 0 L 35 35 L 0 70"); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .reveal { opacity: 1 !important; clip-path: none !important; }
    }
  </style>
