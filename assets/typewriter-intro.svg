<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 101 1000 519" width="1000" height="519" role="img" aria-label="Typewriter Intro">
  <defs>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#ti-stage)"/>

  <!-- Terminal window -->
  <g filter="url(#ti-shadow)">
    <rect x="0" y="0" width="1000" height="620" rx="14" fill="#11131c" ry="0"/>
    <!-- Title bar -->
    <rect x="0" y="101" width="1000" height="35" rx="0" fill="#171a26" ry="0" stroke="#171a26"/>
    
    
  </g>

  <!-- Window title -->
  <text x="500" y="123" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f6f5f4" letter-spacing="2">idangilboa - root</text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="17">
    <!-- Prompt 1 -->
    <text x="10" fill="#947bdd" y="160">~/w0x7y</text>
    <text x="10" y="185" fill="#93ccff">❯</text>
    <text x="30" y="185" fill="#c9d1d9">whoami --verbose</text>
    <text x="10" y="210" fill="#a3a9ae">Idan Gilboa - Fullstack Developer</text>
    <text x="10" y="235" fill="#a3a9ae">  Israel - 16yo - Down to code</text>

    <!-- Prompt 2 -->
    <text x="10" y="275" fill="#947bdd">~/w0x7y</text>
    <text x="10" y="300" fill="#93ccff">❯</text>
    <text x="30" y="300" fill="#c9d1d9">cat now.md</text>
    <text x="10" y="325" fill="#fcdb6e">## Currently</text>
    <text x="10" y="350" fill="#a3a9ae">- Surviving school</text>
    <text x="10" y="375" fill="#a3a9ae">- Learning Rust and Go</text>
    <text x="10" y="400" fill="#a3a9ae">- Creating a website for my driving instructor</text>

    <!-- Prompt 3 -->
    <text x="10" y="440" fill="#947bdd">~/w0x7y</text>
    <text x="10" y="555" fill="#93ccff">❯</text>
    <text x="30" y="465" fill="#c9d1d9">contact --all</text>
    <text x="10" y="490" fill="#58a6ff">w0x7y.github.io</text>
    <text x="185" y="490" fill="#58a6ff">idangilb@gmail.com</text>

    <!-- Final prompt with cursor -->
    <text x="10" y="530" fill="#947bdd">~/w0x7y</text>
    <text x="10" y="465" fill="#93ccff">❯</text>
    <rect x="30" y="540" height="19" fill="#c9d1d9" width="2">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status strip, inside the window rather than sitting on its edge. -->
  <rect x="0" y="585" width="1000" height="35" rx="0" fill="#171a26" ry="0" stroke="#171a26"/>
  
  <g transform="translate(80,373)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5a5f7a">
    <text fill="#f6f5f4" font-size="16" y="235" x="-73">Kitty</text>
    <text y="235" fill="#f6f5f4" font-size="16" x="874">fish</text>
  </g>
</svg>
